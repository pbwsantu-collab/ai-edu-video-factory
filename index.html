<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1e40af" />
  <meta name="description" content="AI Education Video Factory - Create animated educational lessons offline-first" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>AI Education Video Factory</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/styles-anim.css" />
</head>
<body>
  <div id="app">
    <header class="app-header">
      <div class="header-inner">
        <button id="btn-menu" class="icon-btn" aria-label="Open menu" hidden>
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
        </button>
        <h1 class="logo" id="app-title">AI Edu Video Factory</h1>
        <div class="header-actions">
          <button id="btn-new-project" class="btn btn-primary" aria-label="Create new project">+ New Lesson</button>
        </div>
      </div>
    </header>

    <main id="main-content" class="main-content" role="main">
      <!-- Views injected here -->
    </main>

    <div id="toast-container" class="toast-container" aria-live="polite"></div>
    <div id="modal-root"></div>
  </div>

  <script type="module" src="/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(console.warn);
      });
    }
  </script>
</body>
</html>
